<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${errorTitle}">Ошибка сессии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .error-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .btn-home {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            transition: transform 0.3s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card text-center">
        <div class="error-icon">🔐</div>
        <h1 class="mb-3" th:text="${errorTitle}">Ошибка сессии</h1>
        <p class="text-muted mb-4" th:text="${errorMessage}">Сообщение об ошибке</p>

        <div class="alert alert-warning" th:if="${recommendation}">
            <i class="bi bi-info-circle"></i>
            <span th:text="${recommendation}">Рекомендация</span>
        </div>

        <div class="text-muted small mt-3">
            Время: <span th:text="${errorTime}"></span>
        </div>

        <div class="mt-4">
            <a href="/api/v1/hello" class="btn btn-home">Вернуться на страницу входа</a>
        </div>
    </div>
</div>
</body>
</html>
