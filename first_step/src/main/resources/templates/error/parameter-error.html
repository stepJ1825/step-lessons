<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${errorTitle}">Ошибка параметров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .error-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        .btn-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card text-center">
        <div class="error-icon">⚠️</div>
        <h1 class="mb-3" th:text="${errorTitle}">Ошибка параметров</h1>
        <p class="text-muted mb-4" th:text="${errorMessage}">Сообщение об ошибке</p>

        <div class="alert alert-info">
            <strong>Запрошенный URL:</strong><br>
            <code th:text="${requestedUrl}"></code>
        </div>

        <div class="alert alert-warning" th:if="${recommendation}">
            <span th:text="${recommendation}">Рекомендация</span>
        </div>

        <div class="mt-4">
            <a href="javascript:history.back()" class="btn btn-back">Вернуться назад</a>
            <a href="/" class="btn btn-outline-secondary ms-2">На главную</a>
        </div>
    </div>
</div>
</body>
</html>
