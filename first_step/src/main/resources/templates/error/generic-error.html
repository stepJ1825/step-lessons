<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${errorTitle}">Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        .error-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }
        .stack-trace {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            font-size: 12px;
            font-family: monospace;
            overflow-x: auto;
            max-height: 300px;
            text-align: left;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card text-center">
        <div class="error-icon">😵</div>
        <h1 class="mb-3" th:text="${errorTitle}">Непредвиденная ошибка</h1>
        <p class="text-muted mb-4" th:text="${errorMessage}">Сообщение об ошибке</p>

        <div class="alert alert-danger" th:if="${errorDetails}">
            <strong>Детали:</strong><br>
            <code th:text="${errorDetails}"></code>
        </div>

        <div class="alert alert-warning" th:if="${recommendation}">
            <span th:text="${recommendation}">Рекомендация</span>
        </div>

        <details class="mt-3" th:if="${stackTrace}">
            <summary>Техническая информация</summary>
            <div class="stack-trace mt-2">
                <pre th:text="${stackTrace}"></pre>
            </div>
        </details>

        <div class="mt-4">
            <a href="/" class="btn btn-primary">На главную</a>
            <a th:href="'mailto:' + ${supportEmail}" class="btn btn-outline-secondary ms-2">
                Сообщить об ошибке
            </a>
        </div>
    </div>
</div>
</body>
</html>
